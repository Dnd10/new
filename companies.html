<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company SQL Interview Questions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dnd-auth.css">
  <style>
    :root {
      --c-yellow: #ffe500;
      --c-green: #0ae448;
      --c-pink: #ff2d78;
      --c-lavender: #9d95ff;
      --c-orange: #ff8709;
      --c-lime: #abff84;
      --c-cyan: #00bae2;
      --c-ink: #0a0a0a;
      --c-paper: #fff7d6;
      --border: 4px solid var(--c-ink);
      --border-thick: 6px solid var(--c-ink);
      --font-display: "Unbounded", sans-serif;
      --font-stamp: "Bebas Neue", sans-serif;
      --font-mono: "Space Mono", monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-mono);
      background: var(--c-yellow);
      color: var(--c-ink);
      overflow-x: hidden;
      cursor: crosshair;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 160px 160px;
      opacity: 0.2;
      mix-blend-mode: color-dodge;
      z-index: 100;
    }

    button, textarea, a { font: inherit; }
    button, a { cursor: crosshair; }

    h1, h2, h3, p, li, td, th, strong, span, a, button {
      overflow-wrap: break-word;
    }

    .cursor-dot {
      position: fixed;
      width: 18px;
      height: 18px;
      border: 2px solid var(--c-ink);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.18s, height 0.18s, background 0.18s;
      mix-blend-mode: multiply;
    }

    .cursor-dot--large {
      width: 48px;
      height: 48px;
      background: rgba(255, 229, 0, 0.55);
    }

    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 5px;
      width: 100%;
      background: var(--c-pink);
      z-index: 9998;
      transform: scaleX(0);
      transform-origin: left;
    }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 92vh;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
      border-bottom: var(--border-thick);
      background: var(--c-lime);
    }

    .hero__main {
      position: relative;
      z-index: 2;
      padding: clamp(34px, 5vw, 74px);
      border-right: var(--border-thick);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 38px;
    }

    .hero__ghost {
      position: absolute;
      right: -5vw;
      bottom: -5vw;
      font-family: var(--font-stamp);
      font-size: clamp(150px, 28vw, 390px);
      color: transparent;
      -webkit-text-stroke: 2px rgba(10, 10, 10, 0.09);
      line-height: 0.75;
      white-space: nowrap;
      z-index: 1;
    }



    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: relative;
      z-index: 3;
    }

    .brand__title {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      color: inherit;
      text-decoration: none;
    }

    .brand__logo {
      width: clamp(64px, 7vw, 92px);
      height: clamp(64px, 7vw, 92px);
      object-fit: contain;
      flex: 0 0 auto;
      filter: drop-shadow(4px 4px 0 rgba(10, 10, 10, 0.18));
    }

    .brand__mark {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(20px, 3vw, 42px);
      text-transform: uppercase;
      line-height: 0.92;
    }

    .brand__mark span {
      display: block;
      color: transparent;
      -webkit-text-stroke: 2px var(--c-ink);
    }

    .brand__meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .chip {
      border: var(--border);
      background: var(--c-ink);
      color: var(--c-yellow);
      font-size: clamp(9px, 1vw, 12px);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 10px;
      white-space: nowrap;
    }

    .chip--pink { background: var(--c-pink); color: var(--c-ink); }
    .chip--cyan { background: var(--c-cyan); color: var(--c-ink); }
    .chip--yellow { background: var(--c-yellow); color: var(--c-ink); }

    .hero__title {
      position: relative;
      z-index: 3;
      font-family: var(--font-display);
      font-size: clamp(48px, 8vw, 118px);
      font-weight: 900;
      line-height: 0.9;
      text-transform: uppercase;
      max-width: 880px;
      overflow-wrap: normal;
      word-break: normal;
      text-wrap: balance;
      letter-spacing: 0;
    }

    .hero__title span {
      display: block;
      color: transparent;
      -webkit-text-stroke: 4px var(--c-ink);
    }

    .hero__summary {
      position: relative;
      z-index: 3;
      max-width: 740px;
      border-top: var(--border);
      padding-top: 18px;
      font-size: clamp(13px, 1.3vw, 16px);
      line-height: 1.8;
      font-weight: 700;
    }

    .hero__side {
      background: var(--c-pink);
      padding: clamp(26px, 4vw, 56px);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    .scorecard {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border: var(--border-thick);
      background: var(--c-yellow);
    }

    .scorecard__item {
      min-height: 132px;
      padding: 18px;
      border-right: var(--border);
      border-bottom: var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }

    .scorecard__item:nth-child(2n) { border-right: none; }
    .scorecard__item:nth-last-child(-n + 2) { border-bottom: none; }

    .scorecard__label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 700;
    }

    .scorecard__value {
      font-family: var(--font-stamp);
      font-size: clamp(30px, 5vw, 62px);
      line-height: 0.85;
    }

    .mini-terminal {
      position: relative;
      z-index: 2;
      align-self: end;
      border: var(--border-thick);
      background: var(--c-ink);
      color: var(--c-green);
      min-height: 270px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 14px 14px 0 var(--c-yellow);
    }

    .mini-terminal pre {
      white-space: pre-wrap;
      font-size: clamp(12px, 1.2vw, 15px);
      line-height: 1.55;
    }

    .mini-terminal__bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--c-yellow);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      font-size: 11px;
      border-bottom: 2px solid rgba(255, 229, 0, 0.5);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 0.75fr) minmax(0, 1.25fr);
      align-items: start;
      background: var(--c-cyan);
      border-bottom: var(--border-thick);
    }

    .problem {
      position: sticky;
      top: 0;
      min-height: 100vh;
      padding: clamp(26px, 4vw, 56px);
      background: var(--c-lavender);
      border-right: var(--border-thick);
    }

    .section-title {
      position: relative;
      z-index: 3;
      font-family: var(--font-display);
      font-size: clamp(28px, 4.5vw, 68px);
      font-weight: 900;
      line-height: 0.94;
      text-transform: uppercase;
      margin-bottom: 20px;
      overflow-wrap: normal;
      word-break: normal;
    }

    .section-title span {
      color: transparent;
      -webkit-text-stroke: 2px var(--c-ink);
    }

    .problem__text {
      font-size: clamp(13px, 1.25vw, 15px);
      line-height: 1.8;
      border-top: var(--border);
      padding-top: 18px;
      margin-bottom: 24px;
      font-weight: 700;
    }

    .requirements {
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .requirements li {
      border: var(--border);
      background: var(--c-paper);
      padding: 12px 14px;
      line-height: 1.55;
      font-size: 13px;
      font-weight: 700;
    }

    .workbench { display: grid; }

    .panel {
      position: relative;
      overflow: hidden;
      border-bottom: var(--border-thick);
      padding: clamp(24px, 4vw, 52px);
      background: var(--c-paper);
    }

    .panel:nth-child(2) { background: var(--c-yellow); }
    .panel:nth-child(3) { background: var(--c-orange); }
    .panel:nth-child(4) { background: var(--c-lime); }
    .panel:nth-child(5) { background: var(--c-pink); }

    .panel__head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
      position: relative;
      z-index: 3;
    }

    .panel__eyebrow {
      font-family: var(--font-stamp);
      font-size: clamp(20px, 2.6vw, 36px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .panel__ghost {
      position: absolute;
      right: -10px;
      bottom: -18px;
      font-family: var(--font-stamp);
      font-size: clamp(120px, 18vw, 260px);
      line-height: 0.8;
      color: transparent;
      -webkit-text-stroke: 2px rgba(10, 10, 10, 0.08);
      pointer-events: none;
      z-index: 1;
    }

    .schema-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      position: relative;
      z-index: 3;
    }

    .tab, .btn {
      border: var(--border);
      background: var(--c-yellow);
      color: var(--c-ink);
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      transition: transform 0.15s, background 0.15s, color 0.15s;
    }

    .tab { padding: 8px 12px; }
    .tab.is-active, .btn--dark { background: var(--c-ink); color: var(--c-yellow); }
    .btn:hover, .tab:hover { transform: translate(-2px, -2px); background: var(--c-green); color: var(--c-ink); }

    .schema-card {
      display: none;
      position: relative;
      z-index: 3;
      border: var(--border-thick);
      background: white;
    }

    .schema-card.is-active { display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border: 3px solid var(--c-ink);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
      font-size: clamp(11px, 1vw, 13px);
      line-height: 1.45;
    }

    th {
      background: var(--c-ink);
      color: var(--c-yellow);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 10px;
    }

    .data-grid {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .data-box {
      border: var(--border-thick);
      background: white;
      overflow: auto;
      max-width: 100%;
    }

    .data-box__title {
      background: var(--c-ink);
      color: var(--c-yellow);
      padding: 10px 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 11px;
    }

    .editor-wrap {
      position: relative;
      z-index: 3;
      border: var(--border-thick);
      background: var(--c-ink);
      box-shadow: 12px 12px 0 var(--c-cyan);
      overflow: hidden;
    }

    .editor-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: var(--border);
      padding: 12px;
      color: var(--c-yellow);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 11px;
      font-weight: 700;
    }

    .editor-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .code-shell {
      position: relative;
      min-height: 280px;
      background: #111;
      overflow: hidden;
    }

    .code-highlight,
    textarea {
      width: 100%;
      min-height: 280px;
      padding: 22px;
      font-size: clamp(13px, 1.25vw, 16px);
      line-height: 1.7;
      tab-size: 2;
      white-space: pre;
      font-family: var(--font-mono);
    }

    .code-highlight {
      position: absolute;
      inset: 0;
      pointer-events: none;
      color: #d7fbe2;
      min-width: 100%;
    }

    textarea {
      position: relative;
      z-index: 2;
      resize: vertical;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: var(--c-yellow);
      overflow: auto;
    }

    textarea::selection { background: rgba(255, 229, 0, 0.28); }
    .sql-keyword { color: #ffe500; font-weight: 700; }
    .sql-function { color: #00bae2; font-weight: 700; }
    .sql-string { color: #abff84; }
    .sql-number { color: #ff8709; }
    .sql-table { color: #ff2d78; font-weight: 700; }
    .sql-column { color: #9d95ff; }

    .query-result {
      display: none;
      border-top: var(--border);
      background: white;
      color: var(--c-ink);
      padding: 14px;
    }

    .query-result.is-visible { display: block; }

    .query-result__status {
      display: inline-block;
      margin-bottom: 12px;
      border: var(--border);
      background: var(--c-green);
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .query-result__status.is-error {
      background: var(--c-pink);
      color: var(--c-ink);
    }

    .query-result__message {
      font-weight: 700;
      line-height: 1.6;
    }

    .query-result table {
      display: none;
    }

    .query-result.is-correct table {
      display: table;
    }

    .hints {
      position: relative;
      z-index: 3;
      display: grid;
      gap: 12px;
    }

    .hint {
      border: var(--border);
      background: var(--c-paper);
      padding: 14px;
      display: none;
      font-weight: 700;
      line-height: 1.65;
    }

    .hint.is-visible { display: block; }

    .solution-lock {
      position: relative;
      z-index: 3;
      border: var(--border-thick);
      background: var(--c-ink);
      color: var(--c-yellow);
      padding: clamp(18px, 3vw, 30px);
      font-weight: 700;
      line-height: 1.7;
    }

    .solution-lock.is-open {
      background: white;
      color: var(--c-ink);
    }

    .solution-code {
      display: none;
      margin-top: 18px;
      border: var(--border);
      background: #111;
      color: var(--c-green);
      padding: 18px;
      overflow: auto;
      white-space: pre;
      line-height: 1.65;
      font-size: 13px;
    }

    .solution-lock.is-open .solution-code { display: block; }

    .explain-grid {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: var(--border-thick);
      background: white;
    }

    .step {
      min-height: 210px;
      border-right: var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }

    .step:last-child { border-right: none; }

    .step__num {
      font-family: var(--font-stamp);
      font-size: 58px;
      line-height: 0.8;
    }

    .step p {
      font-size: 13px;
      line-height: 1.65;
      font-weight: 700;
    }

    .related {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-top: var(--border-thick);
      background: var(--c-lavender);
    }

    .related-card {
      min-height: 230px;
      padding: clamp(20px, 3vw, 34px);
      border-right: var(--border-thick);
      border-bottom: var(--border-thick);
      color: inherit;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      background: var(--c-yellow);
      transition: background 0.15s, transform 0.15s;
    }

    .related-card:nth-child(2) { background: var(--c-cyan); }
    .related-card:nth-child(3) { background: var(--c-green); border-right: none; }

    .related-card:hover {
      transform: translateY(-6px);
      background: var(--c-pink);
    }

    .related-card__title {
      font-family: var(--font-display);
      font-size: clamp(18px, 2.4vw, 32px);
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
    }

    .related-card__meta {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      border-top: var(--border);
      padding-top: 12px;
    }
    .site-footer {
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      padding: clamp(28px, 4vw, 54px) clamp(20px, 5vw, 72px);
      border-top: var(--border-thick);
      background: var(--c-pink);
      color: var(--c-ink);
    }

    .site-footer__brand {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(20px, 3vw, 38px);
      line-height: 1;
      text-transform: uppercase;
    }

    .site-footer__brand span {
      display: block;
      color: transparent;
      -webkit-text-stroke: 2px var(--c-ink);
    }

    .site-footer__links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .site-footer__links a {
      border: 2px solid var(--c-ink);
      color: inherit;
      background: var(--c-yellow);
      padding: 6px 9px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s, transform 0.15s;
    }

    .site-footer__links a:hover {
      background: var(--c-ink);
      color: var(--c-yellow);
      transform: translateY(-2px);
    }

    @media (max-width: 1020px) {
      .hero, .layout { grid-template-columns: 1fr; }
      .hero__main, .problem {
        border-right: none;
        border-bottom: var(--border-thick);
      }
      .problem {
        position: relative;
        min-height: auto;
      }
    }

    @media (min-width: 761px) {
      .hero__title,
      .section-title {
        word-break: keep-all;
      }

      .hero__title {
        font-size: clamp(44px, 6.8vw, 96px);
      }

      .section-title {
        font-size: clamp(28px, 4vw, 58px);
      }

      .hero__title span,
      .section-title span {
        white-space: nowrap;
      }
    }

    @media (max-width: 760px) {
      .brand, .panel__head {
        align-items: flex-start;
        flex-direction: column;
      }
      .brand__meta { justify-content: flex-start; }
      .scorecard, .data-grid, .explain-grid, .related { grid-template-columns: 1fr; }
      .scorecard__item, .step, .related-card { border-right: none; }
      .hero {
        min-height: auto;
      }
      .hero__title {
        font-size: clamp(38px, 15vw, 76px);
      }
      .section-title {
        font-size: clamp(30px, 12vw, 54px);
      }
      .panel, .problem, .hero__main, .hero__side {
        padding: 24px 18px;
      }
      .mini-terminal {
        min-height: 220px;
        box-shadow: 8px 8px 0 var(--c-yellow);
      }
      .editor-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }
      th, td {
        min-width: 120px;
      }
      .cursor-dot {
        display: none;
      }
      body {
        cursor: auto;
      }
    }

    @media (max-width: 420px) {
      .brand__mark {
        font-size: 26px;
      }
      .chip, .tab, .btn {
        font-size: 10px;
        padding: 8px 10px;
        letter-spacing: 0.08em;
      }
      .scorecard {
        grid-template-columns: 1fr;
      }
      .scorecard__item:nth-child(n) {
        border-right: none;
        border-bottom: var(--border);
      }
      .scorecard__item:last-child {
        border-bottom: none;
      }
    }
  </style>
  <style>
    .hero__title {
      font-size: clamp(32px, 4.6vw, 58px);
      line-height: 1;
      max-width: 100%;
      overflow-wrap: normal;
      word-break: normal;
